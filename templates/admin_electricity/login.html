{% extends "layout_auth.html" %}
{% block title %}Electricity admin login{% endblock %}
{% block auth_content %}
<h1>Electricity admin login</h1>
<p class="lede">For municipal electricity staff only. Citizens should use the <a href="{{ url_for('login') }}">citizen login</a>.</p>

{% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}

<form method="post" novalidate>
  <div class="field">
    <label for="email">Admin email</label>
    <input id="email" name="email" type="email" autocomplete="email" value="{{ email }}" required autofocus>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button class="btn btn-primary btn-block" type="submit">Log in as admin</button>
</form>
{% endblock %}
