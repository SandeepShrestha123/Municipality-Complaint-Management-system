{% extends "base.html" %}
{% block body %}
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand brand-light" href="{{ url_for('elec_admin.dashboard') }}">Nagarsewa <small>Electricity Admin</small></a>
    <nav class="topnav" aria-label="Admin">
      <a href="{{ url_for('elec_admin.dashboard') }}">Requests</a>
      <span class="topnav-user">{{ g.user['full_name'] }} (admin)</span>
      <form method="post" action="{{ url_for('elec_admin.logout') }}">
        <button class="link-btn" type="submit">Log out</button>
      </form>
    </nav>
  </div>
</header>
<main class="page">
  {% include "_flash.html" %}
  {% block content %}{% endblock %}
</main>
{% endblock %}
